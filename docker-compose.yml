services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"          # exposed to the host so the (host-run) Next.js frontend can reach it
    env_file:
      - .env                 # Azure OpenAI / Finnhub / Langfuse keys
    environment:
      # Inside the compose network, reach Langfuse by service name (not localhost).
      LANGFUSE_HOST: http://langfuse-server:3000
      # Persist analyst decisions on a volume instead of inside the ephemeral container.
      FINANCE_DB: /data/fraudguard.db
      # The FinGPT service runs on the HOST (needs host Ollama); reach it via host.docker.internal.
      FINGPT_SERVICE_URL: http://host.docker.internal:8001
    volumes:
      - backend_data:/data
    depends_on:
      - langfuse-server

  langfuse-server:
    image: langfuse/langfuse:2
    depends_on:
      langfuse-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@langfuse-db:5432/langfuse
      NEXTAUTH_SECRET: changeme_secret
      SALT: changeme_salt
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"

  langfuse-db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: langfuse
    volumes:
      - langfuse_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  langfuse_postgres:
  backend_data: